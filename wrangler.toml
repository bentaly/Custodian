name = "custodian"
main = "worker-entry.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production custom domain. Cloudflare reconciles this on deploy (idempotent with the
# domain already attached via the dashboard). Apex only — `www` redirects to apex via a
# Cloudflare Redirect Rule, so the app runs on a single hostname.
#
# workers_dev must stay explicitly true: wrangler defaults it to false once `routes`
# exist, which disables custodian.bental.workers.dev — still needed by the admin app's
# VITE_API_BASE. BETTER_AUTH_URL moved to custodian.fund on 2026-08-25 and no longer
# depends on it; both hostnames stay registered as Google OAuth redirect URIs.
workers_dev = true
routes = [
  { pattern = "custodian.fund", custom_domain = true },
]

[assets]
directory = "dist/client"

# Which deployment Sentry should tag events with. Both Workers are built from the same
# `master` commit by the same CI job, so the build cannot tell them apart — only the
# binding can. Not a secret; the Sentry DSN itself lives in worker-entry.js.
[vars]
SENTRY_ENVIRONMENT = "production"

# Workers Logs — persist console output + uncaught exceptions so a failure can be read
# after the fact in the dashboard (Workers & Pages → the worker → Observability).
#
# This is load-bearing for the pipelines: `/api/apply` answers 202 and the mapping /
# due diligence work happens elsewhere — on the queue below, whose consumer logs every
# message (`[queue] …`), and in `runInBackground`, which logs `[background] <label>
# failed:`. Without collection those logs went nowhere, so a crashed ingest left a row
# stuck at `received` with no way to learn WHY. Note that Cloudflare's own
# `waitUntil() tasks did not complete` warning also lands here — that line, plus a
# `wallTimeMs` near 30000, is the signature of work that outlived its invocation.
#
# Free on both plans at this app's volume (Free: 200k events/day, 3-day retention;
# Paid: 20m/month included, 7-day). head_sampling_rate = 1 logs every invocation —
# only worth lowering if volume ever became a cost issue.
[observability]
enabled = true
head_sampling_rate = 1

# ─── Weekly payments digest — NOT WIRED YET ─────────────────────────────────
#
# `/api/cron/finance-digest` exists and works (POST, `Authorization: Bearer
# $CRON_SECRET`, `?dryRun=1` to render without sending). Nothing calls it on a schedule
# yet, deliberately: we want to read a few Mondays' worth of dry runs before anyone
# receives one. To wire it, uncomment below — and read all three notes first.
#
# 1. `triggers` is an INHERITABLE key. Unlike `vars`, `observability` and the unsafe
#    bindings above, `[env.staging]` inherits it — the same trap `routes = []` exists to
#    dodge. Without the staging override, BOTH Workers fire and every finance officer
#    gets two emails; worse, staging runs a prod snapshot, so the duplicate looks real.
#
# 2. `worker-entry.js` bridges `env` into `process.env` INSIDE `fetch`. A `scheduled`
#    invocation never runs that loop, so DATABASE_URL and RESEND_API_KEY would be
#    undefined and the run would fail silently every Monday. Lift the bridging out and
#    call it from both handlers, then have `scheduled` call `handler.fetch()` with a
#    synthetic Request (an in-process call — no subrequest, no loopback).
#
# 3. Cron fires on UTC and does not follow British Summer Time, so `0 8 * * 1` is 9am
#    London in summer and 8am in winter. That drift is deliberately accepted — the
#    requirement is "in the morning", not a fixed local hour, and pinning it would cost
#    a second trigger out of the five this account gets.
#
# CPU budget: a scheduled handler gets 10ms CPU on the Workers Free plan (on Paid, a
# trigger at a >= 1 hour interval gets 15 minutes). Neon queries and Resend calls are
# I/O and do not count toward it — near enough all of this run is waiting on the network
# — but it is why `run.ts` batches its lookups instead of querying per user.
#
[triggers]
crons = ["0 8 * * 1"]

# Rate limiters for /api/apply. `simple.limit` is requests per `period` (seconds; must
# be 10 or 60). namespace_id is an arbitrary unique id per limiter. Used in
# src/server/rateLimit.ts via the stashed env (see worker-entry.js).
#
# The IP limiter runs before auth, so it also sees authenticated traffic — its ceiling
# is therefore kept ABOVE the per-client limit so a legit client batch-submitting from
# one IP is bounded by their (strong) per-client limit, never tripped by IP first. The
# IP limit is purely a volumetric backstop for the unauthenticated path; the per-client
# limit is the real per-tenant fairness control.
[[unsafe.bindings]]
name = "APPLY_IP_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "APPLY_KEY_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# ─── Pipeline queue ─────────────────────────────────────────────────────────
#
# Where the ingest pipelines run. `/api/apply` and `/api/submit-report` persist the
# submission, answer 202, and put an id on this queue; `worker-entry.js`'s `queue()`
# handler consumes it. They used to run under `ctx.waitUntil`, which Cloudflare
# cancels 30 seconds after the response is sent — silently, because a cancelled
# waitUntil promise is abandoned rather than rejected. The promote path is 35-60s.
#
# `max_batch_size = 1` is a REQUIREMENT on the Free plan, not a preference: the 50
# subrequests-per-invocation cap is per INVOCATION, and one submission already spends
# 13-20 of them (each Neon query is an HTTPS request), so two in a batch would sit at
# ~30 and three would exceed it.
#
# Queue names are per-environment. `queues` is not inherited by named environments,
# but the names would collide if they were reused — staging consuming production's
# submissions is the same class of mistake as staging sending production's email.
[[queues.producers]]
queue = "custodian-pipeline"
binding = "PIPELINE_QUEUE"

[[queues.consumers]]
queue = "custodian-pipeline"
max_batch_size = 1
# A submission is worth several minutes of patience before it is parked: the pipeline
# depends on Anthropic and two public registries, and a brief outage at any of them
# must not turn into a dead-lettered application.
max_retries = 5
retry_delay = 60
dead_letter_queue = "custodian-pipeline-dlq"

[[queues.consumers]]
queue = "custodian-pipeline-dlq"
max_batch_size = 1
# Nothing drains the dead-letter queue automatically — it is a shelf, not a loop.
# Declared only so messages have somewhere to land. A submission that reaches here is
# still safe: its row is in `application_ingests`, shows in the admin queue as
# `pipeline_stalled`, and can be reprocessed by hand.
max_retries = 0

[env.staging]
name = "custodian-staging"
# `routes` is an inheritable key — without this override, staging inherits the
# custodian.fund custom domain and tries to claim it on every deploy.
routes = []
workers_dev = true

# `vars` is not inherited by named environments — repeat it so staging errors are
# tagged as staging rather than silently landing in the production stream.
[env.staging.vars]
SENTRY_ENVIRONMENT = "staging"

# Repeated for staging: staging is where a pipeline change is exercised first, so it is
# the environment whose logs you most need.
[env.staging.observability]
enabled = true
head_sampling_rate = 1

# Staging must NOT send the digest. `triggers` is an inheritable key, so without this
# override staging inherits the cron above and every recipient gets the email twice —
# and staging's user rows are copied from the same Neon lineage as prod, so some of those
# addresses are real mailboxes. An empty list is the override.
[env.staging.triggers]
crons = []

# Unsafe bindings are not inherited by named environments — repeat them for staging.
[[env.staging.unsafe.bindings]]
name = "APPLY_IP_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "APPLY_KEY_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Queues are NOT inherited by named environments — repeated for staging, with its own
# queue names so the two environments can never consume each other's submissions.
[[env.staging.queues.producers]]
queue = "custodian-pipeline-staging"
binding = "PIPELINE_QUEUE"

[[env.staging.queues.consumers]]
queue = "custodian-pipeline-staging"
max_batch_size = 1
max_retries = 5
retry_delay = 60
dead_letter_queue = "custodian-pipeline-staging-dlq"

[[env.staging.queues.consumers]]
queue = "custodian-pipeline-staging-dlq"
max_batch_size = 1
max_retries = 0
